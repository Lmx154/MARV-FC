[package]
name = "launch-telemetry-app"
version = "0.1.0"
description = "Read-only rocket launch telemetry UI"
authors = ["MARV"]
edition = "2021"

[lib]
name = "launch_telemetry_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4", default-features = false }
chrono = { version = "0.4", default-features = true, features = ["clock"] }
marv-hilink = { path = "../../marv-hilink" }

[workspace]
