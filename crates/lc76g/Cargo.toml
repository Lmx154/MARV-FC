[package]
name = "lc76g"
version = "0.1.0"
edition = "2024"
publish = false
description = "Driver for the Quectel LC76G GNSS module on a UART: sans-IO NMEA/PAIR/PQTM core, async and blocking drivers, on embedded-io traits only."

[features]
defmt = ["dep:defmt", "embedded-io/defmt", "embedded-io-async/defmt"]

[dependencies]
embedded-io = "0.7"
embedded-io-async = "0.7"
defmt = { version = "1.0.1", optional = true }
