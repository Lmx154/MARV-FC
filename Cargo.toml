[package]
name = "marv-v2-firmware"
description = "MARV V2 flight-controller firmware: today a skeleton that proves the device drivers link."
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
icm45686 = { path = "../MARV-V2-drivers/icm45686", features = ["defmt"] }
lsm6dsk320x = { path = "../MARV-V2-drivers/lsm6dsk320x", features = ["defmt"] }
bmp581 = { path = "../MARV-V2-drivers/bmp581", features = ["defmt"] }
bmm350 = { path = "../MARV-V2-drivers/bmm350", features = ["defmt"] }
lc76g = { path = "../MARV-V2-drivers/lc76g", features = ["defmt"] }
pio-sdmmc = { path = "../MARV-V2-drivers/pio-sdmmc", features = ["defmt", "embassy-rp-0-10"] }
qmi-psram = { path = "../MARV-V2-drivers/qmi-psram", features = ["rp2350", "defmt"] }
ws2812c = { path = "../MARV-V2-drivers/ws2812c", features = ["defmt", "embassy-rp"] }

embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-rp = { version = "0.10.0", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp235xb", "binary-info"] }

defmt = "1.0.1"
defmt-rtt = "1.0.0"
cortex-m = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"
critical-section = "1.1"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
semihosting = "0.1"

[profile.release]
debug = true
