# On-target tests for the MARV V2 Rev 1 board: one package per driver, so a driver that does not
# build cannot stop another driver's test. Run a test with `tools/run.sh <binary>` from the repo root.
[workspace]
resolver = "3"
members = [
    "common",
    "alive",
    "pio-sdmmc",
    "icm45686",
    "lsm6dsk320x",
    "bmp581",
    "bmm350",
    "lc76g",
    "qmi-psram",
    "ws2812c",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[workspace.dependencies]
hil-common = { path = "common" }

embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-rp = { version = "0.10.0", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp235xb", "binary-info"] }
embassy-futures = "0.1.2"
embedded-hal = "1.0"
embedded-hal-async = "1.0"
embedded-hal-bus = { version = "0.3", features = ["async"] }

defmt = "1.0.1"
defmt-rtt = "1.0.0"
cortex-m = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"
critical-section = "1.1"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
portable-atomic = { version = "1.5", features = ["critical-section"] }
semihosting = "0.1"
static_cell = "2.1"

[profile.release]
debug = true
