[package]
name = "fw-settings"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "MARV V2 firmware settings: per device, the parameter table and the pure rule that turns the parameters into the driver's configuration. No hardware, tested on the host."
rust-version = "1.99"

[dependencies]
fw-core = { path = "../fw-core" }
# `Gains`, `GAIN_NAMES` and the defaults and bounds of the 14 gain parameters (`flight::TABLE` is built from them).
fw-flight = { path = "../fw-flight" }
# The driver's `Config` types, at the same commit as the binary's (without its `defmt` feature).
bmp581 = { git = "https://github.com/Lmx154/bmp581-rs.git", rev = "5046a13c476ca9493e5dddd3d019a23b6d05395b" }
# The magnetometer driver's `Config` types (same commit as the binary's, without `defmt`).
bmm350 = { git = "https://github.com/Lmx154/bmm350-rs.git", rev = "d233caac832582f3c67be3332e12baf9970d0d6a" }
# The battery monitor's configuration types (same commit as the binary's, without `defmt`).
adc-battery = { git = "https://github.com/Lmx154/adc-battery.git", rev = "3d8ad8ebbbc45bb2cb4d23ccad84c77dc0989e26" }
# `MarvDevice` (the device ids of the parameter tables); the same commit as fw-core's.
mavlink-device = { git = "https://github.com/Lmx154/mavlink-device.git", rev = "d1ac8e615c40e172be5dcb2087eb6edffea0a777" }
# The IMU drivers' `Config` types (same commits as the binary's, without `defmt`).
icm45686 = { git = "https://github.com/Lmx154/icm45686-rs.git", rev = "78b13c709acc2464194c08731434750b85799927" }
lsm6dsk320x = { git = "https://github.com/Lmx154/lsm6dsk320x-rs.git", rev = "447e881bbfa43ad216563f6ed751c1936b771952" }
# The GNSS driver's `Config` and `Pvt` types (the same checkout as the binary's, without `defmt`).
sam-m10q = { git = "https://github.com/Lmx154/sam-m10q.git", rev = "d9f6c8858118dc677dfa62b475700c45be46f350" }
