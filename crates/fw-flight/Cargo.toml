[package]
name = "fw-flight"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "MARV V2 flight-core tasks (core 1). No embassy-time, embassy-sync or defmt by rule. The liveness answer, the IMU device loop, the ESC logic and the flight step (estimator, controller, allocator, arming gate)."
rust-version = "1.99"

[dependencies]
fw-core = { path = "../fw-core" }
# The `DelayNs` trait the IMU loop receives for its start and recovery waits (the trait the
# icm45686 driver takes; already in the lock through it).
embedded-hal-async = "1.0"
# The DShot codec types (`LineCapture`, `Command`, `LineFrame`): plain Rust, no HAL here; the
# `embassy-rp-0-10` back-end is the binary's business (decision-esc-telemetry Q6, F2).
dshot = { git = "https://github.com/Lmx154/dshot-rs.git", rev = "3557eb111097400c91277c5a69ddefce22c3be44" }
# The vehicle card's `const` data (rotors, k_F, k_M, the level map, MIX), no_std by default
# (decision-sim-card 7b). Pinned to a commit of MARV-sim `main`, like a driver; to take a newer card change `rev`
# and run `cargo update -p marv-card`. To build against a local checkout instead, add to the workspace Cargo.toml:
#   [patch."https://github.com/Lmx154/MARV-sim.git"]
#   marv-card = { path = "../MARV-sim/marv-card" }
marv-card = { git = "https://github.com/Lmx154/MARV-sim.git", rev = "fd5e4963e8de91d3b4f1efe9b38ab41d35ce789c" }
# sqrtf, sinf, cosf for the flight code (MIT, no dependencies; decision-first-pair 7b).
libm = "0.2"
