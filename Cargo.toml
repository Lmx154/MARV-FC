[package]
name = "marv-v2-firmware"
description = "MARV V2 flight-controller firmware: today the two-core skeleton (a MAVLink node on USB on core 0, the liveness answer on core 1)."
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[workspace]
members = ["crates/fw-core", "crates/fw-flight", "crates/fw-settings"]
resolver = "3"

[dependencies]
# The device drivers, one GitHub repository each, pinned to a commit (the state verified on the board on
# 2026-11-11). The crate name is the repository name without "-rs".
# To take a newer driver: change its `rev` to the new commit and run `cargo update -p <crate>`.
# To work on a driver and the firmware together, override it locally without editing this file:
#   [patch."https://github.com/Lmx154/icm45686-rs.git"]
#   icm45686 = { path = "../MARV-V2-drivers/icm45686" }
icm45686 = { git = "https://github.com/Lmx154/icm45686-rs.git", rev = "78b13c709acc2464194c08731434750b85799927", features = ["defmt"] }
lsm6dsk320x = { git = "https://github.com/Lmx154/lsm6dsk320x-rs.git", rev = "447e881bbfa43ad216563f6ed751c1936b771952", features = ["defmt"] }
bmp581 = { git = "https://github.com/Lmx154/bmp581-rs.git", rev = "5046a13c476ca9493e5dddd3d019a23b6d05395b", features = ["defmt"] }
bmm350 = { git = "https://github.com/Lmx154/bmm350-rs.git", rev = "d233caac832582f3c67be3332e12baf9970d0d6a", features = ["defmt"] }
adc-battery = { git = "https://github.com/Lmx154/adc-battery.git", rev = "3d8ad8ebbbc45bb2cb4d23ccad84c77dc0989e26", features = ["defmt"] }
# The GNSS receiver (src/gnss.rs): the u-blox SAM-M10Q, UBX only (decision-gnss-m10-20261122).
sam-m10q = { git = "https://github.com/Lmx154/sam-m10q.git", rev = "d9f6c8858118dc677dfa62b475700c45be46f350", features = ["defmt"] }
pio-sdmmc = { git = "https://github.com/Lmx154/pio-sdmmc-rs.git", rev = "424fd58b4beb7607e426c398494c836b4bfe1fb3", features = ["defmt", "embassy-rp-0-10", "block-device-driver-0-2"] }
# The four ESCs (src/esc.rs): bidirectional DShot on PIO2 with `PioDshot`; the same commit as in
# crates/fw-flight/Cargo.toml, so there is one copy of it.
dshot = { git = "https://github.com/Lmx154/dshot-rs.git", rev = "3557eb111097400c91277c5a69ddefce22c3be44", features = ["defmt", "embassy-rp-0-10"] }

# The status LED (src/led.rs): the WS2812C on GPIO43 over PIO1 state machine 1 with `PioTransport`. Its HAL
# feature is named `embassy-rp` (it is written for embassy-rp 0.10).
ws2812c = { git = "https://github.com/Lmx154/ws2812c-rs.git", rev = "faf1eb52a88ddf70f502a4a77d5d8facfbe44a0d", features = ["defmt", "embassy-rp"] }

# The PSRAM (src/psram.rs): the 16 MiB ISSI IS66WVS16M8FBLL in socket U24 on QMI chip select 1 (GPIO0), at the uncached
# alias 0x15000000. Raw registers, no HAL; the critical-section implementation is embassy-rp's. Core 0 only.
qmi-psram = { git = "https://github.com/Lmx154/qmi-psram-rs.git", rev = "82f8dbb79d2a61a3c0bfceda8f37aa1b2af81217", features = ["rp2350", "defmt"] }

# The firmware's own crates: the hardware-free logic and the flight-core tasks.
fw-core = { path = "crates/fw-core" }
fw-flight = { path = "crates/fw-flight" }
fw-settings = { path = "crates/fw-settings" }
# The USB byte pipe and the MAVLink device layer, pinned to a commit of their `hands-off` branch (change `rev`,
# then `cargo update -p <crate>`). mavlink-device has the same `rev` as in crates/fw-core/Cargo.toml,
# so there is one copy of it.
usb-cdc = { git = "https://github.com/Lmx154/usb-cdc.git", rev = "47cb09087d517b6813e3211e742d9d7d5ff9e379", features = ["defmt"] }
mavlink-device = { git = "https://github.com/Lmx154/mavlink-device.git", rev = "d1ac8e615c40e172be5dcb2087eb6edffea0a777", features = ["defmt"] }
# The ELRS receiver's UART (src/rc.rs): CRSF and MAVLink, following the receiver. Its crsf-codec and
# mavlink-device are git dependencies at the commits used here (one copy of mavlink-device).
rc-port = { git = "https://github.com/Lmx154/rc-port.git", rev = "b2e996088ddccdc10b6703513d28f07193552db1", features = ["embassy-rp-0-10"] }

embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-rp = { version = "0.10.0", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp235xb", "binary-info"] }

defmt = "1.0.1"
defmt-rtt = "1.0.0"
cortex-m = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"
critical-section = "1.1"
embassy-sync = "0.8.0"
embassy-usb = { version = "0.6.0", default-features = false, features = ["defmt"] }
embedded-io-async = "0.7"
# IMU1 and IMU2 (src/imu1.rs, src/imu2.rs): the SPI device over embassy-rp's bus and the `DelayNs`
# trait, as the icm45686 and lsm6dsk320x bench programs use them.
embedded-hal-async = "1.0"
embedded-hal-bus = { version = "0.3", features = ["async"] }
embassy-futures = "0.1.2"
static_cell = "2.1.1"
# The FAT32 file system on the SD card (src/sd.rs, src/sd_probe.rs) and its stream adapters (`BufStream`, `StreamSlice`):
# git only (no release), both at one commit of master (2026-10-23), with the `[patch.crates-io]` below so that
# the one `BlockDevice<512>` trait in the tree is the one pio-sdmmc implements. 8.3 names, no chrono (FAT
# times 1980-01-01), no log, no alloc.
embedded-fatfs = { git = "https://github.com/MabezDev/embedded-fatfs", rev = "7961cd4eb64de51818d8cdda991713784fa98366", default-features = false }
block-device-adapters = { git = "https://github.com/MabezDev/embedded-fatfs", rev = "7961cd4eb64de51818d8cdda991713784fa98366", default-features = false }
# The lock-free waker static behind the SD bus's `DMA_IRQ_1` handler (pio-sdmmc `DmaWaker`).
atomic-waker = "1.1"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
semihosting = "0.1"

[features]
# NEGATIVE CONTROL: core 1 is started but its liveness task is not spawned, so PONG never follows PING.
no-fbeat = []
# Fault injection around the barometer's adapter (src/inject.rs): after 5 s of good samples,
# `acquire` fails 4 times in a row, once (transient), or every `acquire`, `recover` and `restart`
# fails (persistent).
inject-baro-transient = ["inject"]
inject-baro-persistent = ["inject"]
# Also around the adapter, each acting once, 5 s after the first good sample: the data-ready edges
# swallowed for 200 ms (missed-edge) or 1 s with `status` saying "nothing pending" (silent); one
# `verify` answering "mismatch"; one `acquire` answering a power-on reset (por); `acquire` that never returns (stuck).
inject-baro-missed-edge = ["inject"]
inject-baro-silent = ["inject"]
inject-baro-verify = ["inject"]
inject-baro-por = ["inject"]
# Also: as persistent until a RESTART request (`device restart BARO`) has been raised, then everything works again.
inject-baro-fail-until-restart = ["inject"]
inject-baro-stuck = ["inject"]
# A hung I2C1 transaction below the deadline (src/i2cbus.rs `hang`): the inner transaction never
# completes, once from 15 s of uptime, once at boot (the first transaction), or for ever from 15 s on.
inject-baro-hang-once = ["inject-baro-hang"]
inject-baro-hang-boot = ["inject-baro-hang"]
inject-baro-hang-forever = ["inject-baro-hang"]
# Internal: on when an I2C1 hang feature is on.
inject-baro-hang = []
# The same around the magnetometer's adapter: 5 s after the first good sample every acquire, recover and
# restart fails until a RESTART request (`device restart MAG`) has been raised, then everything works.
inject-mag-fail-until-restart = ["inject-mag"]
# The same around the GNSS receiver's adapter (src/gnss.rs): 10 s after the first good sample the
# adapter stops seeing sentences (the wrapper swallows them) until a RESTART request (`device restart GNSS`).
inject-gnss-silent = []
# While a compass calibration runs, its input (not the published samples) is a synthetic rotation:
# the six points of a sphere of radius 50 uT about (10, -20, 30) uT (src/calibration.rs).
inject-mag-rotation = []
# Internal: on when any injection feature is on.
inject = []
# Internal: on when a magnetometer injection feature is on.
inject-mag = []
# Fault injection around IMU1's adapter (src/imu1.rs, src/imu_inject.rs, flight core, no log there), 5 s after the
# first good sample: every acquire, recover and restart fails until a RESTART request
# (`device restart IMU1`) has been raised (persistent); the data-ready edges swallowed for 200 ms
# while the chip keeps producing (missed-edge).
inject-imu1-persistent = ["inject-imu1"]
inject-imu1-missed-edge = ["inject-imu1"]
# Internal: on when an IMU1 injection feature is on.
inject-imu1 = ["inject-imu"]
# The same around IMU2's adapter (src/imu2.rs): every acquire, recover and restart fails 5 s after the
# first good sample until a RESTART request (`device restart IMU2`) has been raised (persistent).
inject-imu2-persistent = ["inject-imu2"]
# Once, 5 s after IMU2's first good sample: one verify step answers "mismatch" (then reconfigure).
inject-imu2-verify = ["inject-imu2"]
# Internal: on when an IMU2 injection feature is on.
inject-imu2 = ["inject-imu"]
# With any IMU injection feature, the injection starts 60 s (not 5 s) after the first good sample, so the
# vehicle can be armed first (src/imu_inject.rs; flight-gap decision, 2026-11-19).
inject-late = []
# Internal: on when an IMU injection feature is on (src/imu_inject.rs, the wrapper both IMUs use).
inject-imu = []
# Board checks of the ESC task (decision-esc-telemetry Q5), not for a release: esc-off: the ESC task is not
# built or spawned, nothing touches PIO2, DMA channel 5 or GPIO36-39 (the IMU baseline of B3; the ESC row
# reads FAILED, stuck); esc-no-edt: no EDT burst starts, every other frame is unchanged (the negative control
# of B1: no extended telemetry).
esc-off = []
esc-no-edt = []
# Invariant F1 on the board: one core-0 task spins 1.2 s without yielding, once, 20 s after start.
stall-core0 = []
# NEGATIVE CONTROL of F4: a DMA channel built on core 0 before the start-up check (no transfer;
# its line is disabled again before core 1 starts).
f4-negative = []
# The settings checks (src/settings.rs): 60 s after start, 100 saves one second apart with BARO_IIR_T
# alternating 1 and 3, then a summary line (save-loop); the handshake's armed flag set at boot, so a
# save must end FAILED "armed" (fake-armed); at boot, before the settings are read, one byte of the
# newest valid record programmed to 0x00 (corrupt-newest).
save-loop = []
fake-armed = []
corrupt-newest = []
# NEGATIVE CONTROL of the range guard: at boot an erase just below the settings region, a program just
# above its end and an empty program, each to be refused before any flash call (guard-negative). The
# first save after boot also stores ZZZ_UNKNOWN = 1 and BARO_ODR_HZ = 33, as a record from another
# firmware version might (save-foreign).
guard-negative = []
save-foreign = []
# NEGATIVE CONTROL of core 0's stack guard (memory.x `_stack_end`, MSPLIM): 10 s after a start the watchdog
# did not cause, a core-0 task recurses until the stack pointer is 2 KiB below `_stack_end`: with the
# guard it faults (the watchdog resets, boot report "TimedOut, record false"); without it `[FAIL]`.
stack-negative = []
# The watchdog checks (src/watchdog.rs), each acting once, 20 s after a start the watchdog did not
# cause (so never again after the reset it provokes): the barometer's task spins forever without
# yielding (hang-core0: core 0's executor stalls); IMU1's task on the flight core spins forever
# (hang-flight: PONG stops); the barometer's task spins 1.0 s, then goes on (spin-1s: one text, no
# reset); core 0 turns interrupts off and spins forever (hang-irqoff: the monitor cannot run, reset
# with no record).
hang-core0 = []
hang-flight = []
spin-1s = []
hang-irqoff = []
# Also: whether the scratch registers 0 to 3 survive a watchdog
# time-out reset (5 s after start), then a forced reset (30 s after the next start); at most two
# resets; no monitor.
wdg-scratch-probe = []

# Latency experiment (src/device.rs `latency_text`): at 60 s a baseline of both IMUs' flight-core
# figures, at 300 s and 590 s two STATUSTEXTs per IMU (and one log line) for the interval since it;
# the text queue holds 32 instead of 8.
latency-text = []
# The supervisor's periodic `[STAT]` lines (uptime, devices, watchdog) are not printed.
quiet-stat = []
# Probe P3 of the SD logging design (src/sd_probe.rs): from 20.5 s a core-0 task builds the SD bus (PIO0
# SM0, DMA channel 4 on DMA_IRQ_1), prints the INTEn and NVIC checks, mounts the FAT32 volume of MBR
# partition 1, times the free-space query, writes LOGS/P3TEST.BIN (16 MiB in 4 KiB writes, a flush each
# second), reads it back and compares, lists LOGS/ and un-mounts. sd-fat-format first writes a new MBR and
# formats partition 1 FAT32 (32 KiB clusters, label MARV): it ERASES the card.
sd-fat-probe = []
sd-fat-format = ["sd-fat-probe"]
# Also: after the mount, instead of the 16 MiB burst, 150 s at the logger's duty: one 4 KiB write to
# LOGS/P3PACED.BIN every 700 ms and a flush every second, then close and un-mount.
sd-fat-paced = ["sd-fat-probe"]
# Measurement only (src/xip_probe.rs): at start the QMI flash read mode and the cost of one XIP cache
# miss (three passes and a control), then an extra `[STAT]` line with the XIP accesses, hits and misses.
xip-stat = []
# Test hooks of the SD card's device task (src/sd.rs; the card cannot be pulled on the desk):
# inject-sd-no-card replaces the result of every card `init` with `NoCard`; inject-sd-wrong-format hands
# the MBR check a block 0 whose partition 1 type is 0x07 (exFAT/NTFS).
inject-sd-no-card = []
inject-sd-wrong-format = []
# Test hooks of the log writer (src/sd.rs): inject-sd-write-fail: 60 s after the log opened the next six
# write calls fail without card traffic (three pieces, each with its retry: three error events, the ladder
# recovers and the next log number is opened); log-verify: after the mount and before the new log is opened,
# the previous log (the number in LOGS/LASTLOG.TXT) is read through fw-core's dflog walker and summarised;
# inject-log-small-volume: the first open's clean-up (before the log is opened) is told a volume of 500 MiB
# plus the listed bytes minus one, so the oldest log is deleted once; inject-log-delete-big: the first open's
# clean-up is told a volume of 500 MiB plus the bytes of the logs after the largest one in ring order, so
# every log up to and including the largest is deleted (a long deletion on the board).
inject-sd-write-fail = []
log-verify = []
inject-log-small-volume = []
inject-log-delete-big = []
# NEGATIVE CONTROL of Q1-I1: INTE0 bit 4 (the SD card's channel) is set before the SD task's register
# check and cleared after it: the INTE0 check must FAIL.
sd-irq-negative = []
# NEGATIVE CONTROL of the RAM-code guard (decision-ram-code-20261115): `now_us` is linked into flash
# (section `.text.ram_negative`, never inlined), so tools/check-ram-code.py must FAIL naming it;
# tools/run.sh then requires that failure (exit 1) before it flashes.
ram-negative = []
# The board check of the RAM-code design (src/xip_park.rs, decision-ram-code-20261115 Q5): 30 s after
# start a 1 s window of both cores' XIP accesses (more than 100 000: the counter runs), then core 0 parks 1.0 s in SRAM with
# interrupts off and the XIP accesses counted meanwhile (core 1's) must be 0 with both IMUs sampling;
# with ram-negative at least 1000. Not together with xip-stat.
xip-park = []
# The N0 bench (src/bin/eskf_bench.rs, decision-nav-eskf-20261120 section 11): fw-flight's eskf_n0 module, for that
# binary only (`BIN=eskf_bench FEATURES=eskf-bench tools/run.sh 60`); the flight binary is built without it.
eskf-bench = ["fw-flight/eskf-n0"]
# Props-off bench of the in-air restart (decision-inair-restart-20261125; docs/build-and-test.md): every arm-switch STOP,
# on the ground too, lets an arm ON within 5 s restart the motors at once with any throttle (the free-fall test forced
# true), to measure spin-up from ESC telemetry. PROPS OFF; never for flight.
restart-bench = ["fw-flight/restart-bench"]

# The PSRAM checks (src/psram.rs), built for the board, run by the lead. psram-skip-remap: the hook after a flash
# erase or program does not remap, so the canary must FAIL after the first save. psram-absent: the driver's init is
# treated as failed (no chip access): the board boots, the PSRAM state reads FAULT, nothing panics. NEGATIVE CONTROL
# psram-negative: core 1's `now_us` reads the PSRAM canary, so tools/check-ram-code.py must FAIL naming it (a static
# check, never flashed).
psram-skip-remap = []
psram-absent = []
psram-negative = []

[[bin]]
name = "eskf_bench"
path = "src/bin/eskf_bench.rs"
required-features = ["eskf-bench"]

[profile.release]
debug = true

# qmi-psram must be optimised in debug builds too: unoptimised, its chip-select pulses last up to 13 us against the
# chip's 4 us limit (the driver's README).
[profile.dev.package.qmi-psram]
opt-level = 3

# One `block-device-driver` in the tree: the one of the embedded-fatfs commit above, which
# block-device-adapters uses, also for pio-sdmmc (its trait text is that of crates.io 0.2.0).
[patch.crates-io]
block-device-driver = { git = "https://github.com/MabezDev/embedded-fatfs", rev = "7961cd4eb64de51818d8cdda991713784fa98366" }
