[package]
name = "marv-v2-firmware"
description = "MARV V2 flight-controller firmware: today the two-core skeleton (a MAVLink node on USB on core 0, the liveness answer on core 1)."
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[workspace]
members = ["crates/fw-core", "crates/fw-flight", "crates/fw-settings"]
resolver = "3"

[dependencies]
# The device drivers, one GitHub repository each, pinned to a commit (the state verified on the board on
# 2026-11-11; see docs/handoff.md). The crate name is the repository name without "-rs".
# To take a newer driver: change its `rev` to the new commit and run `cargo update -p <crate>`.
# To work on a driver and the firmware together, override it locally without editing this file:
#   [patch."https://github.com/Lmx154/icm45686-rs.git"]
#   icm45686 = { path = "../MARV-V2-drivers/icm45686" }
icm45686 = { git = "https://github.com/Lmx154/icm45686-rs.git", rev = "867093eea748ea7b8ea968a2a1d8258ba7fa47e3", features = ["defmt"] }
lsm6dsk320x = { git = "https://github.com/Lmx154/lsm6dsk320x-rs.git", rev = "07a888901f29654faa6ec51394f3aa8e81481e51", features = ["defmt"] }
bmp581 = { git = "https://github.com/Lmx154/bmp581-rs.git", rev = "5046a13c476ca9493e5dddd3d019a23b6d05395b", features = ["defmt"] }
bmm350 = { git = "https://github.com/Lmx154/bmm350-rs.git", rev = "d233caac832582f3c67be3332e12baf9970d0d6a", features = ["defmt"] }
lc76g = { git = "https://github.com/Lmx154/lc76g-rs.git", rev = "2ee54f927bd0ffb7c4f7a4978c84cc2af962f405", features = ["defmt"] }
pio-sdmmc = { git = "https://github.com/Lmx154/pio-sdmmc-rs.git", rev = "d07804875fedf32121bd48314ad975bbd9534f5f", features = ["defmt", "embassy-rp-0-10"] }
qmi-psram = { git = "https://github.com/Lmx154/qmi-psram-rs.git", rev = "591ca04501144fa40b66ed17262df836f258c076", features = ["rp2350", "defmt"] }
ws2812c = { git = "https://github.com/Lmx154/ws2812c-rs.git", rev = "831c70b527a87bba9e63969d3c5632cf8a7ac892", features = ["defmt", "embassy-rp"] }

# The firmware's own crates: the hardware-free logic and the flight-core tasks.
fw-core = { path = "crates/fw-core" }
fw-flight = { path = "crates/fw-flight" }
fw-settings = { path = "crates/fw-settings" }
# The USB byte pipe and the MAVLink device layer, pinned to a commit of their `main` (change `rev`,
# then `cargo update -p <crate>`). mavlink-device has the same `rev` as in crates/fw-core/Cargo.toml,
# so there is one copy of it.
usb-cdc = { git = "https://github.com/Lmx154/usb-cdc.git", rev = "47cb09087d517b6813e3211e742d9d7d5ff9e379", features = ["defmt"] }
mavlink-device = { git = "https://github.com/Lmx154/mavlink-device.git", rev = "dfdb11a03ac3c8a28792c4f23ee3cd6ca045a93c", features = ["defmt"] }

embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-rp = { version = "0.10.0", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp235xb", "binary-info"] }

defmt = "1.0.1"
defmt-rtt = "1.0.0"
cortex-m = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"
critical-section = "1.1"
embassy-sync = "0.8.0"
embassy-usb = { version = "0.6.0", default-features = false, features = ["defmt"] }
embedded-io-async = "0.7"
# IMU1 (src/imu1.rs): the SPI device over embassy-rp's bus and the `DelayNs` trait, as the
# icm45686 bench programs use them.
embedded-hal-async = "1.0"
embedded-hal-bus = { version = "0.3", features = ["async"] }
embassy-futures = "0.1.2"
static_cell = "2.1.1"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
semihosting = "0.1"

[features]
# NEGATIVE CONTROL: core 1 is started but its liveness task is not spawned, so PONG never follows PING.
no-fbeat = []
# Fault injection around the barometer's adapter (src/inject.rs): after 5 s of good samples,
# `acquire` fails 4 times in a row, once (transient), or every `acquire`, `recover` and `restart`
# fails (persistent).
inject-baro-transient = ["inject"]
inject-baro-persistent = ["inject"]
# Also around the adapter, each acting once, 5 s after the first good sample: the data-ready edges
# swallowed for 200 ms (missed-edge) or 1 s with `status` saying "nothing pending" (silent); one
# `verify` answering "mismatch"; one `acquire` answering a power-on reset (por); `acquire` that never returns (stuck).
inject-baro-missed-edge = ["inject"]
inject-baro-silent = ["inject"]
inject-baro-verify = ["inject"]
inject-baro-por = ["inject"]
# Also: as persistent until a RESTART request (`device restart BARO`) has been raised, then everything works again.
inject-baro-fail-until-restart = ["inject"]
inject-baro-stuck = ["inject"]
# Internal: on when any injection feature is on.
inject = []
# Fault injection around IMU1's adapter (src/imu1.rs, flight core, no log there), 5 s after the
# first good sample: every acquire, recover and restart fails until a RESTART request
# (`device restart IMU1`) has been raised (persistent); the data-ready edges swallowed for 200 ms
# while the chip keeps producing (missed-edge).
inject-imu1-persistent = ["inject-imu1"]
inject-imu1-missed-edge = ["inject-imu1"]
# Internal: on when an IMU1 injection feature is on.
inject-imu1 = []
# Invariant F1 on the board: one core-0 task spins 3 s without yielding, once, 20 s after start.
stall-core0 = []
# NEGATIVE CONTROL of F4: a DMA channel built on core 0 before the start-up check (no transfer;
# its line is disabled again before core 1 starts).
f4-negative = []
# The settings checks (src/settings.rs): 60 s after start, 100 saves one second apart with BARO_IIR_T
# alternating 1 and 3, then a summary line (save-loop); the handshake's armed flag set at boot, so a
# save must end FAILED "armed" (fake-armed); at boot, before the settings are read, one byte of the
# newest valid record programmed to 0x00 (corrupt-newest).
save-loop = []
fake-armed = []
corrupt-newest = []

[profile.release]
debug = true
